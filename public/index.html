<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shuttle Session Manager</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#152a54">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#152a54; --navy-deep:#0c1830; --gold:#f4b400; --gold-deep:#c98f00;
  --court:#0e9469; --court-deep:#0a6b4c; --coral:#e63946; --coral-deep:#a3222c;
  --bg:#eef1f7; --card:#ffffff; --line:#e2e6ef; --text:#1a2332; --muted:#64708a;
  --peach:#fde8dc; --wa:#25D366; --wa-deep:#128c43;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--text);
  display:flex; flex-direction:column; min-height:100vh;
}
h1,h2,.brand-font{ font-family:'Poppins','Inter',sans-serif; }

#splash{position:fixed;inset:0;background:linear-gradient(160deg,var(--navy),var(--navy-deep));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:999;}
#splash .logo{font-size:52px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3));}
#splash .spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#splash .msg{font-size:14px;color:#c3cddd;}

header{
  background:linear-gradient(135deg,var(--navy),var(--navy-deep));
  color:#fff; padding:16px 22px;
  display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
  box-shadow:0 4px 14px rgba(0,0,0,.2);
}
header .brand{display:flex;align-items:center;gap:12px;}
header .logo{
  width:40px;height:40px;border-radius:12px;
  background:linear-gradient(160deg,var(--gold),var(--gold-deep));
  display:flex;align-items:center;justify-content:center;font-size:20px;
  box-shadow:0 3px 0 #8a6400, 0 4px 10px rgba(0,0,0,.25);
}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px;}
header .sub{font-size:13px;color:#c9d2e6;font-weight:500;}

select,button,input{font-family:'Inter',sans-serif;font-size:14px;}
input,select{padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;background:#fff;}
input:focus,select:focus{outline:none;border-color:var(--court);box-shadow:0 0 0 3px rgba(14,148,105,.15);}

/* ===== 3D pressable buttons ===== */
button{
  cursor:pointer; border:none; border-radius:10px; padding:10px 16px;
  font-weight:600; font-size:14px;
  background:linear-gradient(180deg,#ffffff,#eef1f6);
  color:var(--navy);
  box-shadow:0 3px 0 #c7cede, 0 4px 10px rgba(20,30,60,.10);
  transition:transform .08s ease, box-shadow .08s ease;
}
button:hover{filter:brightness(1.03);}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #c7cede, 0 2px 4px rgba(20,30,60,.10);}
button:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;}

button.primary{
  background:linear-gradient(180deg,#22b17c,var(--court));
  color:#fff;
  box-shadow:0 4px 0 var(--court-deep), 0 6px 14px rgba(14,148,105,.35);
}
button.primary:active{box-shadow:0 1px 0 var(--court-deep);}

button.danger{
  background:linear-gradient(180deg,#ee5a4d,var(--coral));
  color:#fff;
  box-shadow:0 4px 0 var(--coral-deep), 0 6px 14px rgba(230,57,70,.35);
}
button.danger:active{box-shadow:0 1px 0 var(--coral-deep);}

button.wa{
  background:linear-gradient(180deg,#2fdb7a,var(--wa));
  color:#fff;
  box-shadow:0 4px 0 var(--wa-deep), 0 6px 14px rgba(37,211,102,.35);
}
button.wa:active{box-shadow:0 1px 0 var(--wa-deep);}

button.big{padding:14px 22px;font-size:16px;}
button.ghost{
  background:rgba(255,255,255,.08);color:#e6ecf7;
  box-shadow:none;border:1.5px solid rgba(255,255,255,.28);
}
button.ghost:active{transform:none;background:rgba(255,255,255,.16);}
button.link-btn{background:none;box-shadow:none;padding:4px 6px;color:var(--court);font-weight:600;text-decoration:underline;}
button.link-btn:active{transform:none;}

nav{
  display:flex; gap:4px; background:var(--navy-deep); padding:0 16px;
  overflow-x:auto; box-shadow:inset 0 -1px 0 rgba(255,255,255,.06);
}
nav button{
  background:transparent; color:#9fb0cf; border:none; border-radius:0; box-shadow:none;
  padding:14px 20px; border-bottom:4px solid transparent; white-space:nowrap;
  font-size:14px; font-weight:700; font-family:'Poppins',sans-serif;
}
nav button:active{transform:none;}
nav button.active{color:#fff;}
nav button[data-tab="session"].active{border-bottom-color:var(--court);}
nav button[data-tab="payments"].active{border-bottom-color:var(--coral);}
nav button[data-tab="report"].active{border-bottom-color:var(--gold);}
nav button[data-tab="setup"].active{border-bottom-color:#7ea6ff;}

main{max-width:1100px;margin:20px auto;padding:0 16px 44px;flex:1;width:100%;}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:20px; margin-bottom:16px;
  box-shadow:0 2px 6px rgba(20,30,60,.05), 0 10px 28px rgba(20,30,60,.05);
}
.card h2{margin:0 0 4px;font-size:17px;color:var(--navy);font-weight:700;}
.card h2.tab-session{color:var(--court-deep);}
.card h2.tab-payments{color:var(--coral-deep);}
.card h2.tab-report{color:var(--gold-deep);}
.card h2.tab-setup{color:#2451a8;}
.card .sub{margin:0 0 14px;color:var(--muted);font-size:13px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
@media(max-width:800px){.two-col{grid-template-columns:1fr;}}

table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);}
th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;}
.num{text-align:right;font-variant-numeric:tabular-nums;}
.muted{color:var(--muted);font-size:13px;}

.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.b-paid{background:#e1f6ec;color:var(--court-deep);}
.b-due{background:#fce4e2;color:var(--coral-deep);}
.b-warn{background:#fdeecb;color:#8a5c10;}
.b-critical{background:#3a1414;color:#ffb3a8;}

.toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:var(--navy-deep);color:#fff;padding:12px 20px;border-radius:10px;
  font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
}
.toast.show{opacity:1;}

.undo-bar{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:var(--navy-deep);color:#fff;padding:10px 10px 10px 16px;border-radius:10px;
  font-size:13px;display:none;align-items:center;gap:12px;z-index:100;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
}
.undo-bar.show{display:flex;}
.undo-bar button{background:var(--gold);color:var(--navy-deep);box-shadow:none;font-weight:700;padding:6px 12px;}

.member-list{display:flex;flex-direction:column;gap:4px;}
.member-row{
  display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;
  cursor:pointer;border:1.5px solid var(--line);background:#fff;
  transition:all .12s ease;
}
.member-row:hover{border-color:#c7cede;transform:translateY(-1px);box-shadow:0 3px 8px rgba(20,30,60,.08);}
.member-row.on{background:#e6f8f0;border-color:var(--court);box-shadow:0 2px 0 var(--court-deep);}
.avatar{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(160deg,#2c4a8c,var(--navy));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;flex-shrink:0;
}
.member-row.on .avatar{background:linear-gradient(160deg,#22b17c,var(--court));}
.member-info{flex:1;min-width:0;}
.member-name{font-weight:600;font-size:14px;}
.member-owed{font-size:11px;color:var(--coral-deep);font-weight:700;}
.switch{width:44px;height:25px;border-radius:20px;background:#d8dce6;position:relative;flex-shrink:0;transition:background .15s;}
.switch.on{background:var(--court);}
.switch .knob{width:19px;height:19px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
.switch.on .knob{left:22px;}
.present-counter{font-size:13px;color:var(--muted);margin-bottom:10px;font-weight:600;}

.summary{
  background:linear-gradient(135deg,#f0f4fa,#e7ecf7);
  border:1px solid var(--line);border-radius:14px;padding:16px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;
}
.summary div span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.4px;}
.summary div strong{font-size:20px;color:var(--navy);font-family:'Poppins',sans-serif;}

.reminder-card{border:2px solid var(--wa);background:#effcf3;}

.payline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.payline:last-child{border-bottom:none;}
.payline-info{font-size:13px;}
.partial-box{display:flex;gap:8px;align-items:center;margin-top:8px;background:#f6f8fb;padding:10px;border-radius:10px;}

.report{border-collapse:collapse;width:100%;font-size:12px;}
.report th,.report td{border:1px solid #ccd3e2;padding:6px 8px;}
.report thead th{background:var(--navy);color:#fff;text-align:center;font-size:12px;}
.report .metric td{background:#f6f7fb;font-weight:600;}
.report .shr{background:var(--peach);text-align:right;font-variant-numeric:tabular-nums;}
.report .pmark{text-align:center;font-weight:700;color:var(--court-deep);}
.report .amark{text-align:center;font-weight:700;color:var(--coral-deep);}
.report tfoot td{background:linear-gradient(90deg,var(--gold),var(--gold-deep));color:#3a2b00;font-weight:700;text-align:right;}
.report .pay{text-align:right;font-weight:700;}

.danger-zone{border:1.5px solid var(--coral);background:#fdf1f0;}
.danger-zone h2{color:var(--coral-deep);}
.gate{max-width:400px;margin:70px auto;text-align:center;}
.gate .pin-input{font-size:26px;letter-spacing:12px;text-align:center;width:100%;margin:16px 0;font-weight:700;}

footer{
  text-align:center;padding:18px;color:var(--muted);font-size:12px;
  border-top:1px solid var(--line);background:#fff;
}
footer strong{color:var(--navy);}

@media print{
  .no-print{display:none!important;}
  body{background:#fff;}
  main{max-width:none;margin:0;padding:0;}
  .card{border:none;padding:0;box-shadow:none;}
}
</style>
</head>
<body>
<div id="splash"><div class="logo">🏸</div><div class="spinner"></div><div class="msg" id="splashMsg">Waking up server…</div></div>

<header class="no-print">
  <div class="brand">
    <div class="logo">🏸</div>
    <div>
      <h1 id="hdrTitle">Shuttle Session Manager</h1>
      <div class="sub" id="hdrSub"></div>
    </div>
  </div>
  <div id="hdrActions"></div>
</header>
<nav id="navBar" class="no-print"></nav>
<main id="content"></main>
<footer>Powered by <strong>A1 Groups</strong></footer>
<div class="toast" id="toast"></div>
<div class="undo-bar" id="undoBar"></div>

<script>
/* ===================================================================
   API CLIENT
   =================================================================== */
const TOKEN_KEY = "shuttle_token";
const ACTOR_KEY = "shuttle_actor";
function getToken(){ return localStorage.getItem(TOKEN_KEY); }
function setToken(t){ localStorage.setItem(TOKEN_KEY, t); }
function clearToken(){ localStorage.removeItem(TOKEN_KEY); }

async function api(path, options = {}){
  const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
  const token = getToken();
  if(token) headers.Authorization = `Bearer ${token}`;
  const res = await fetch(path, { ...options, headers });
  const data = await res.json().catch(() => ({}));
  if(res.status === 401){ clearToken(); STATE.fl = null; render(); throw new Error(data.message || "Signed out."); }
  if(!res.ok) throw new Error(data.message || "Something went wrong.");
  return data;
}

const STATE = { fl: null, page: "session" };

/* ===================================================================
   HELPERS
   =================================================================== */
let TOAST_TIMER = null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(TOAST_TIMER);
  TOAST_TIMER = setTimeout(() => el.classList.remove("show"), 2400);
}
function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function shortDate(iso){
  const [y,m,d] = iso.split("-").map(Number);
  const mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1];
  return `${d}-${mon}-${String(y).slice(2)}`;
}
function dayName(iso){
  const [y,m,d] = iso.split("-").map(Number);
  return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date(y,m-1,d).getDay()];
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function daysSince(iso){
  const [y,m,d] = iso.split("-").map(Number);
  return Math.floor((Date.now() - new Date(y,m-1,d).getTime()) / 86400000);
}
const FILS = 1000;
function bhd(fils){ return (fils / FILS).toFixed(3); }
function pricePerShuttleFils(price, perTube){ return price / perTube; }

function paidAmountFor(fl, key, share){
  const v = fl.paid[key];
  if(v === true) return share;
  return Number(v) || 0;
}
function outstandingFils(fl, memberId){
  return fl.sessions.reduce((sum,s) => {
    const share = s.shares[memberId];
    if(!share) return sum;
    const paid = paidAmountFor(fl, `${s.id}_${memberId}`, share);
    return sum + Math.max(0, share - paid);
  }, 0);
}
function sessionsInPeriod(fl, period, anchorISO){
  const [y,m,d] = anchorISO.split("-").map(Number);
  const anchor = new Date(y, m-1, d);
  return fl.sessions.filter(s => {
    const [sy,sm,sd] = s.date.split("-").map(Number);
    const dt = new Date(sy, sm-1, sd);
    if(period === "day")   return s.date === anchorISO;
    if(period === "month") return sy === y && sm === m;
    if(period === "week"){
      const start = new Date(anchor); start.setDate(anchor.getDate() - anchor.getDay());
      const end = new Date(start); end.setDate(start.getDate() + 6);
      return dt >= start && dt <= end;
    }
    return true;
  }).sort((a,b) => a.date.localeCompare(b.date));
}

/* ===================================================================
   UNDO BAR
   =================================================================== */
let UNDO_TIMER = null;
function showUndoBar(message, onUndo){
  const bar = document.getElementById("undoBar");
  bar.innerHTML = `<span>${escapeHtml(message)}</span><button id="undoBtn">Undo</button>`;
  bar.classList.add("show");
  document.getElementById("undoBtn").onclick = () => {
    clearTimeout(UNDO_TIMER);
    bar.classList.remove("show");
    onUndo();
  };
  clearTimeout(UNDO_TIMER);
  UNDO_TIMER = setTimeout(() => bar.classList.remove("show"), 5000);
}

/* ===================================================================
   LOGIN
   =================================================================== */
const FLIGHT_NAMES = ["Premier Flight","Flight 1","Flight 2","Flight 3","Flight 4A","Flight 4B"];

function pageLogin(){
  return `
  <div class="card gate">
    <h2>🏸 Sign in to your flight</h2>
    <p class="sub">Pick your flight and enter its PIN. First time in? Type a new 4–6 digit PIN to create it.</p>
    <div class="field" style="text-align:left;margin-bottom:10px">
      <label>Flight</label>
      <select id="loginFlight">${FLIGHT_NAMES.map(n => `<option value="${n}">${n}</option>`).join("")}</select>
    </div>
    <div class="field" style="text-align:left;margin-bottom:10px">
      <label>Your name (shown on games you save)</label>
      <input id="loginActor" placeholder="e.g. Rakesh" style="width:100%" value="${escapeHtml(localStorage.getItem(ACTOR_KEY) || "")}">
    </div>
    <input class="pin-input" id="loginPin" type="password" inputmode="numeric" maxlength="6" placeholder="••••">
    <button class="primary big" style="width:100%" onclick="attemptLogin()">Continue</button>
  </div>`;
}

async function attemptLogin(){
  const flightName = document.getElementById("loginFlight").value;
  const pin = document.getElementById("loginPin").value.trim();
  const actor = document.getElementById("loginActor").value.trim();
  try{
    const data = await api("/api/login", { method:"POST", body: JSON.stringify({ flightName, pin }) });
    setToken(data.token);
    if(actor) localStorage.setItem(ACTOR_KEY, actor);
    STATE.fl = data.flight;
    STATE.page = "session";
    render();
    toast(`Welcome, ${flightName}.`);
  }catch(err){ toast(err.message); }
}

function signOut(){
  if(!confirm("Sign out? You'll need your PIN to sign back in.")) return;
  clearToken();
  STATE.fl = null;
  render();
}

function changeActor(){
  const name = prompt("Your name:", localStorage.getItem(ACTOR_KEY) || "");
  if(name && name.trim()){ localStorage.setItem(ACTOR_KEY, name.trim()); render(); }
}

/* ===================================================================
   PUBLIC PLAYER VIEW (?p=token — no login)
   =================================================================== */
async function renderPublicView(token){
  document.getElementById("navBar").innerHTML = "";
  document.getElementById("hdrActions").innerHTML = "";
  try{
    const res = await fetch(`/api/public/${token}`);
    const data = await res.json();
    if(!res.ok) throw new Error(data.message);
    document.getElementById("hdrTitle").textContent = data.flightName;
    document.getElementById("hdrSub").textContent = `Balance for ${data.memberName}`;
    const rows = data.unpaidGames.map(g => `<tr><td>${shortDate(g.date)}</td><td class="num">BHD ${bhd(g.dueFils)}</td></tr>`).join("");
    document.getElementById("content").innerHTML = `
      <div class="card" style="max-width:420px;margin:40px auto;text-align:center">
        <h2>${escapeHtml(data.memberName)}</h2>
        <p style="font-size:30px;font-weight:800;font-family:'Poppins',sans-serif;color:${data.outstandingFils?"var(--coral)":"var(--court)"}">BHD ${bhd(data.outstandingFils)}</p>
        <p class="muted">${data.outstandingFils ? "outstanding" : "all settled — nothing owed"}</p>
        ${rows ? `<table style="margin-top:16px"><tr><th>Date</th><th class="num">Amount</th></tr>${rows}</table>` : ""}
      </div>`;
  }catch(err){
    document.getElementById("content").innerHTML = `<div class="card" style="max-width:420px;margin:40px auto;text-align:center"><p class="muted">${escapeHtml(err.message)}</p></div>`;
  }
}

/* ===================================================================
   ROUTER
   =================================================================== */
const TABS = [
  ["session","1 · New Session"],
  ["payments","2 · Payments"],
  ["report","3 · Report"],
  ["setup","4 · Setup"]
];

function goto(page){ STATE.page = page; render(); }

async function refreshFlight(){
  STATE.fl = await api("/api/flight");
}

async function render(){
  if(!getToken() || !STATE.fl){
    document.getElementById("hdrTitle").textContent = "Shuttle Session Manager";
    document.getElementById("hdrSub").textContent = "";
    document.getElementById("hdrActions").innerHTML = "";
    document.getElementById("navBar").innerHTML = "";
    document.getElementById("content").innerHTML = pageLogin();
    return;
  }

  const fl = STATE.fl;
  const actor = localStorage.getItem(ACTOR_KEY) || "Unnamed";
  document.getElementById("hdrTitle").textContent = fl.flightName;
  document.getElementById("hdrSub").textContent = fl.adminName ? `Admin: ${fl.adminName}` : "Admin name not set — add it in Setup";
  document.getElementById("hdrActions").innerHTML = `
    <span class="muted" style="margin-right:10px;color:#c9d2e6;font-size:13px">
      Logged in as ${escapeHtml(actor)} · <a href="#" onclick="changeActor();return false;" style="color:#e6ecf7">change</a>
    </span>
    <button class="ghost" onclick="signOut()">🔒 Sign out</button>`;

  document.getElementById("navBar").innerHTML = TABS.map(([id,label]) =>
    `<button data-tab="${id}" class="${STATE.page===id?"active":""}" onclick="goto('${id}')">${label}</button>`).join("");

  const DISPATCH = { setup:pageSetup, session:pageSession, payments:pagePayments, report:pageReport };
  document.getElementById("content").innerHTML = DISPATCH[STATE.page](fl);
}

/* ===================================================================
   TAB — SETUP
   =================================================================== */
function pageSetup(fl){
  const perShuttle = fl.shuttlesPerTube > 0 ? pricePerShuttleFils(fl.tubePriceFils, fl.shuttlesPerTube) : 0;
  const stock = fl.shuttlesInStock || 0;

  const rows = fl.members.map((m,i) => {
    const owed = outstandingFils(fl, m.id);
    return `<tr>
      <td class="num">${i+1}</td>
      <td>${escapeHtml(m.name)}${m.phone ? `<br><span class="muted">${escapeHtml(m.phone)}</span>` : ""}</td>
      <td>${m.active ? '<span class="badge b-paid">Active</span>' : '<span class="badge b-due">Inactive</span>'}</td>
      <td class="num">${owed ? `<span style="color:var(--coral-deep);font-weight:700">BHD ${bhd(owed)}</span>` : "—"}</td>
      <td class="num">
        <button onclick="toggleMember('${m.id}')">${m.active ? "Deactivate" : "Activate"}</button>
        <button onclick="editMember('${m.id}')">Edit</button>
        <button onclick="copyPlayerLink('${m.publicToken}','${escapeHtml(m.name)}')">🔗 Link</button>
        <button class="danger" onclick="deleteMember('${m.id}')">Delete</button>
      </td></tr>`;
  }).join("");

  return `
  <div class="two-col">
    <div class="card">
      <h2 class="tab-setup">${escapeHtml(fl.flightName)} settings</h2>
      <p class="sub">Set these once. Change them only when stock or pricing changes.</p>
      <div class="field" style="margin-bottom:12px">
        <label>Flight admin name</label>
        <input id="adminName" value="${escapeHtml(fl.adminName)}" placeholder="e.g. Rakesh" style="width:220px">
      </div>
      <div class="row">
        <div class="field"><label>Current stock</label>
          <div style="padding:9px 0;font-weight:800;color:var(--navy);font-family:'Poppins',sans-serif;font-size:15px">
            ${stock} shuttles <span class="muted" style="font-weight:400;font-size:13px">(${(stock/fl.shuttlesPerTube).toFixed(1)} tubes)</span>
          </div></div>
        <div class="field"><label>Add tubes</label>
          <input type="number" min="0" id="addTubes" placeholder="e.g. 5" style="width:100px"></div>
        <div class="field"><label>Shuttles/tube</label>
          <input type="number" id="perTube" value="${fl.shuttlesPerTube}" style="width:100px"></div>
        <div class="field"><label>Tube price (BHD)</label>
          <input type="number" step="0.001" id="tubePrice" value="${bhd(fl.tubePriceFils)}" style="width:110px"></div>
        <div class="field"><label>&nbsp;</label><button class="primary" onclick="saveSettings()">Save settings</button></div>
      </div>
      <p class="muted" style="margin-top:12px">Price per shuttle: <strong style="color:var(--navy)">BHD ${bhd(perShuttle)}</strong> (${bhd(fl.tubePriceFils)} ÷ ${fl.shuttlesPerTube}).</p>
    </div>

    <div class="card no-print">
      <h2 class="tab-setup">Change your PIN</h2>
      <p class="sub">Only someone who already knows the current PIN can change it.</p>
      <div class="row">
        <input type="password" inputmode="numeric" maxlength="6" id="oldPin" placeholder="Current PIN" style="width:130px">
        <input type="password" inputmode="numeric" maxlength="6" id="newPin" placeholder="New PIN" style="width:130px">
        <button class="primary" onclick="changePin()">Update PIN</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2 class="tab-setup">Members — ${fl.members.filter(m=>m.active).length} active</h2>
    <div class="row" style="margin-bottom:14px">
      <input id="newMemberName" placeholder="Member name" style="width:180px" onkeydown="if(event.key==='Enter')addMember()">
      <input id="newMemberPhone" placeholder="Phone incl. country code" style="width:190px">
      <button class="primary" onclick="addMember()">Add member</button>
    </div>
    <table><tr><th style="width:40px">#</th><th>Name</th><th>Status</th><th class="num">Outstanding</th><th></th></tr>
      ${rows || `<tr><td colspan="5" class="muted">No members yet — add the first one above.</td></tr>`}</table>
  </div>

  <div class="card danger-zone no-print">
    <h2>⚠ Danger zone</h2>
    <p class="sub">Data is stored on the server and never deleted automatically. This is the only way to erase it.</p>
    <button class="danger" onclick="resetFlightData()">Erase this flight's data</button>
  </div>`;
}

async function saveSettings(){
  try{
    STATE.fl = await api("/api/flight/settings", { method:"POST", body: JSON.stringify({
      adminName: document.getElementById("adminName").value.trim(),
      tubePriceFils: Math.round(Number(document.getElementById("tubePrice").value) * 1000),
      shuttlesPerTube: Number(document.getElementById("perTube").value),
      addTubes: Number(document.getElementById("addTubes").value) || 0
    })});
    render(); toast("Settings saved.");
  }catch(err){ toast(err.message); }
}

async function changePin(){
  try{
    await api("/api/flight/pin", { method:"POST", body: JSON.stringify({
      oldPin: document.getElementById("oldPin").value.trim(),
      newPin: document.getElementById("newPin").value.trim()
    })});
    toast("PIN updated.");
  }catch(err){ toast(err.message); }
}

async function addMember(){
  const name = document.getElementById("newMemberName").value.trim();
  const phone = document.getElementById("newMemberPhone").value.trim();
  if(!name){ toast("Type a name first."); return; }
  try{
    STATE.fl = await api("/api/members", { method:"POST", body: JSON.stringify({ name, phone }) });
    render(); toast(`${name} added.`);
  }catch(err){ toast(err.message); }
}

async function toggleMember(id){
  try{ STATE.fl = await api(`/api/members/${id}/toggle`, { method:"PATCH" }); render(); }
  catch(err){ toast(err.message); }
}

async function editMember(id){
  const m = STATE.fl.members.find(x => x.id===id);
  const name = prompt("Name:", m.name);
  if(name === null) return;
  const phone = prompt("Phone (with country code, or blank to clear):", m.phone || "");
  if(phone === null) return;
  try{
    STATE.fl = await api(`/api/members/${id}`, { method:"PATCH", body: JSON.stringify({ name: name.trim(), phone: phone.trim() }) });
    render(); toast("Member updated.");
  }catch(err){ toast(err.message); }
}

async function deleteMember(id){
  const m = STATE.fl.members.find(x => x.id===id);
  if(!confirm(`Permanently delete ${m.name}? This can't be undone.`)) return;
  try{
    STATE.fl = await api(`/api/members/${id}`, { method:"DELETE" });
    render(); toast(`${m.name} deleted.`);
  }catch(err){ toast(err.message); }
}

function copyPlayerLink(token, name){
  const url = `${location.origin}/?p=${token}`;
  navigator.clipboard.writeText(url).then(() => toast(`Link copied — send it to ${name}.`))
    .catch(() => toast(url));
}

async function resetFlightData(){
  const typed = prompt('Type DELETE to permanently erase this flight\'s members, sessions and payments:');
  if(typed !== "DELETE"){ toast("Cancelled — nothing was deleted."); return; }
  try{
    STATE.fl = await api("/api/flight/reset", { method:"DELETE" });
    render(); toast("This flight's data was erased.");
  }catch(err){ toast(err.message); }
}

/* ===================================================================
   TAB — NEW SESSION
   =================================================================== */
let PRESENT = new Set();

function pageSession(fl){
  const active = fl.members.filter(m => m.active);
  if(!active.length){
    return `<div class="card"><h2 class="tab-session">No members yet</h2>
      <p class="sub">Add this flight's members in the Setup tab first.</p>
      <button class="primary" onclick="goto('setup')">Go to Setup</button></div>`;
  }

  const stock = fl.shuttlesInStock || 0;
  const lowStock = stock <= fl.shuttlesPerTube;
  const rows = active.map(m => memberRowHtml(fl, m)).join("");

  const recent = fl.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6).map(s =>
    `<tr><td>${shortDate(s.date)}<br><span class="muted">${dayName(s.date)}${s.createdBy ? ` · by ${escapeHtml(s.createdBy)}` : ""}</span></td>
      <td class="num">${s.shuttlesUsed}</td><td class="num">${s.presentIds.length}</td>
      <td class="num">${bhd(s.totalCostFils)}</td>
      <td class="num">${bhd(Math.round(s.totalCostFils / s.presentIds.length))}</td>
      <td class="num"><button class="danger" onclick="deleteSession('${s.id}')">Delete</button></td></tr>`
  ).join("");

  return `
  ${lowStock ? `<div class="card no-print" style="border-left:5px solid var(--coral);background:#fdf1f0">
    <h2 style="color:var(--coral-deep)">⚠ Low stock</h2>
    <p class="sub">Only ${stock} shuttle(s) left (${(stock/fl.shuttlesPerTube).toFixed(1)} tubes). Restock soon from the Setup tab.</p>
  </div>` : ""}
  <div class="card">
    <h2 class="tab-session">Mark today's game</h2>
    <div class="row" style="margin-bottom:14px">
      <div class="field"><label>Game date</label><input type="date" id="sessionDate" value="${todayISO()}"></div>
      <div class="field"><label>Shuttles used</label>
        <input type="number" min="0" max="${stock}" id="shuttlesUsed" placeholder="e.g. 10" style="width:120px" oninput="refreshPreview()"></div>
      <div class="field"><label>&nbsp;</label><button onclick="selectAll()">Select all</button></div>
      <div class="field"><label>&nbsp;</label><button onclick="clearAllPresent()">Clear</button></div>
    </div>
    <input type="text" id="memberSearch" placeholder="🔍 Search player…" style="width:100%;margin-bottom:10px" oninput="filterMemberList(this.value)">
    <div class="present-counter" id="presentCounter">${PRESENT.size} of ${active.length} present</div>
    <div class="member-list" id="memberList">${rows}</div>
    <div class="summary" id="preview" style="margin-top:16px">${previewHtml(fl, 0)}</div>
    <div style="margin-top:18px"><button class="primary big" onclick="saveSession()">Save game &amp; charge players</button></div>
    <p class="muted" style="margin-top:10px">
      Price per shuttle: BHD ${bhd(pricePerShuttleFils(fl.tubePriceFils, fl.shuttlesPerTube))} · Stock: <strong>${stock} shuttles</strong>
    </p>
  </div>
  <div class="card"><h2 class="tab-session">Recent games</h2>
    <table><tr><th>Date</th><th class="num">Shuttles</th><th class="num">Present</th><th class="num">Day cost</th><th class="num">Each share</th><th></th></tr>
      ${recent || `<tr><td colspan="6" class="muted">No games saved yet.</td></tr>`}</table>
  </div>`;
}

function memberRowHtml(fl, m){
  const arrears = outstandingFils(fl, m.id);
  const on = PRESENT.has(m.id);
  const initials = m.name.trim().split(/\s+/).map(w => w[0]).slice(0,2).join("").toUpperCase();
  return `<div class="member-row ${on?"on":""}" data-id="${m.id}" data-name="${escapeHtml(m.name.toLowerCase())}" onclick="togglePresent('${m.id}')">
    <div class="avatar">${initials}</div>
    <div class="member-info">
      <div class="member-name">${escapeHtml(m.name)}</div>
      ${arrears ? `<div class="member-owed">owes BHD ${bhd(arrears)}</div>` : ""}
    </div>
    <div class="switch ${on?"on":""}"><div class="knob"></div></div>
  </div>`;
}

function filterMemberList(query){
  const q = query.trim().toLowerCase();
  document.querySelectorAll(".member-row").forEach(row => {
    row.style.display = row.dataset.name.includes(q) ? "" : "none";
  });
}

function previewHtml(fl, used){
  const n = PRESENT.size;
  const total = used > 0 ? Math.round(used * pricePerShuttleFils(fl.tubePriceFils, fl.shuttlesPerTube)) : 0;
  const each = n > 0 ? Math.round(total / n) : 0;
  return `
    <div><span>Players present</span><strong>${n}</strong></div>
    <div><span>Shuttles used</span><strong>${used || 0}</strong></div>
    <div><span>Day cost</span><strong>BHD ${bhd(total)}</strong></div>
    <div><span>Each player pays</span><strong style="color:var(--court-deep)">BHD ${bhd(each)}</strong></div>`;
}
function refreshPreview(){
  const used = Number(document.getElementById("shuttlesUsed")?.value || 0);
  const el = document.getElementById("preview");
  if(el) el.innerHTML = previewHtml(STATE.fl, used);
}

function togglePresent(id){
  PRESENT.has(id) ? PRESENT.delete(id) : PRESENT.add(id);
  const row = document.querySelector(`.member-row[data-id="${id}"]`);
  if(row){ row.classList.toggle("on"); row.querySelector(".switch").classList.toggle("on"); }
  const counter = document.getElementById("presentCounter");
  if(counter) counter.textContent = `${PRESENT.size} of ${STATE.fl.members.filter(m=>m.active).length} present`;
  refreshPreview();
}
function selectAll(){
  STATE.fl.members.filter(m => m.active).forEach(m => PRESENT.add(m.id));
  document.querySelectorAll(".member-row").forEach(el => { el.classList.add("on"); el.querySelector(".switch").classList.add("on"); });
  document.getElementById("presentCounter").textContent = `${PRESENT.size} of ${STATE.fl.members.filter(m=>m.active).length} present`;
  refreshPreview();
}
function clearAllPresent(){
  PRESENT.clear();
  document.querySelectorAll(".member-row").forEach(el => { el.classList.remove("on"); el.querySelector(".switch").classList.remove("on"); });
  document.getElementById("presentCounter").textContent = `0 of ${STATE.fl.members.filter(m=>m.active).length} present`;
  refreshPreview();
}

async function saveSession(){
  const date = document.getElementById("sessionDate").value;
  const used = Number(document.getElementById("shuttlesUsed").value);
  if(!date){ toast("Pick the game date."); return; }
  if(!Number.isInteger(used) || used <= 0){ toast("Enter how many shuttles were used."); return; }
  if(PRESENT.size === 0){ toast("Tap at least one player who was present."); return; }
  if(STATE.fl.sessions.some(s => s.date === date)){
    if(!confirm(`A game is already saved for ${shortDate(date)}. Save another one on the same date?`)) return;
  }
  try{
    STATE.fl = await api("/api/sessions", { method:"POST", body: JSON.stringify({
      date, shuttlesUsed: used, presentIds:[...PRESENT],
      createdBy: localStorage.getItem(ACTOR_KEY) || ""
    })});
    PRESENT.clear();
    render();
    toast(`${shortDate(date)} saved.`);
  }catch(err){ toast(err.message); }
}

function deleteSession(id){
  const s = STATE.fl.sessions.find(x => x.id===id);
  if(!s) return;
  STATE.fl.sessions = STATE.fl.sessions.filter(x => x.id !== id);
  render();
  showUndoBar(`Game on ${shortDate(s.date)} deleted.`, () => {
    STATE.fl.sessions.push(s);
    STATE.fl.sessions.sort((a,b) => a.date.localeCompare(b.date));
    render();
    toast("Restored.");
  });
  UNDO_TIMER = setTimeout(async () => {
    try{ STATE.fl = await api(`/api/sessions/${id}`, { method:"DELETE" }); render(); }
    catch(err){ toast(err.message); await refreshFlight(); render(); }
  }, 5000);
}

/* ===================================================================
   TAB — PAYMENTS (one amount box per game, one Settle all per player)
   =================================================================== */
let REMINDER_QUEUE = [];
let REMINDER_POS = 0;

function agingBadge(days){
  if(days >= 30) return `<span class="badge b-critical">${days}d overdue</span>`;
  if(days >= 14) return `<span class="badge b-warn">${days}d overdue</span>`;
  return "";
}

function pagePayments(fl){
  const withCharges = fl.members.filter(m => fl.sessions.some(s => s.shares[m.id]));
  if(!withCharges.length) return `<div class="card"><h2 class="tab-payments">Nothing to collect yet</h2></div>`;

  const totalOwed = withCharges.reduce((sum,m) => sum + outstandingFils(fl, m.id), 0);
  const remindable = withCharges.filter(m => m.phone && outstandingFils(fl, m.id) > 0);

  const rows = withCharges.map(m => {
    const owed = outstandingFils(fl, m.id);
    const unpaid = fl.sessions.filter(s => {
      const share = s.shares[m.id];
      if(!share) return false;
      return paidAmountFor(fl, `${s.id}_${m.id}`, share) < share;
    });

    const gameLines = unpaid.map(s => {
      const share = s.shares[m.id];
      const paid = paidAmountFor(fl, `${s.id}_${m.id}`, share);
      const remaining = share - paid;
      const key = `${s.id}_${m.id}`;
      const days = daysSince(s.date);
      return `
        <div class="payline">
          <div class="payline-info">
            ${shortDate(s.date)} — <strong>BHD ${bhd(remaining)}</strong> due
            ${paid > 0 ? `<span class="muted">(BHD ${bhd(paid)} already paid)</span>` : ""} ${agingBadge(days)}
          </div>
          <div class="row">
            <input type="number" step="0.001" min="0" max="${bhd(remaining)}" placeholder="Amount paid (BHD)" id="pay_${key}" style="width:150px">
            <button class="primary" onclick="addPayment('${s.id}','${m.id}')">Add payment</button>
          </div>
        </div>`;
    }).join("");

    return `<div class="card" style="margin-bottom:12px">
      <div class="row" style="justify-content:space-between;margin-bottom:${unpaid.length?"6px":"0"}">
        <h2 style="margin:0;font-size:15px">${escapeHtml(m.name)}</h2>
        <div class="row">
          <strong style="color:${owed?"var(--coral-deep)":"var(--court-deep)"};font-size:16px;font-family:'Poppins',sans-serif">BHD ${bhd(owed)}</strong>
          ${owed ? `<button class="primary" onclick="settleAll('${m.id}')">Settle all</button>` : `<span class="badge b-paid">All settled</span>`}
        </div>
      </div>
      ${gameLines}
    </div>`;
  }).join("");

  return `
  <div class="card"><h2 class="tab-payments">Who still owes</h2>
    <p class="sub">Type the amount a player paid you and click "Add payment" — enter the full amount to clear a game, or less for a partial payment. "Settle all" clears everything for that player at once.</p>
    <div class="summary" style="margin-bottom:16px">
      <div><span>Total outstanding</span><strong style="color:var(--coral-deep)">BHD ${bhd(totalOwed)}</strong></div>
      <div><span>Players owing</span><strong>${withCharges.filter(m => outstandingFils(fl,m.id)>0).length}</strong></div>
      <div><span>Games recorded</span><strong>${fl.sessions.length}</strong></div>
    </div>
    ${remindable.length ? `<button class="wa" onclick="startReminderQueue()">📱 Send Reminders (${remindable.length})</button>` : ""}
  </div>
  <div id="reminderArea"></div>
  ${rows}`;
}

async function addPayment(sessionId, memberId){
  const key = `${sessionId}_${memberId}`;
  const input = document.getElementById(`pay_${key}`);
  const amountFils = Math.round(Number(input.value) * 1000);
  if(!amountFils || amountFils <= 0){ toast("Enter an amount in BHD."); return; }
  try{
    STATE.fl = await api(`/api/payments/${sessionId}/${memberId}/pay-partial`, { method:"POST", body: JSON.stringify({ amountFils }) });
    render(); toast("Payment recorded.");
  }catch(err){ toast(err.message); }
}

async function settleAll(memberId){
  const m = STATE.fl.members.find(x => x.id===memberId);
  if(!confirm(`Mark everything as received from ${m.name}?`)) return;
  try{ STATE.fl = await api(`/api/payments/${memberId}/settle-all`, { method:"POST" }); render(); toast(`${m.name} settled.`); }
  catch(err){ toast(err.message); }
}

function startReminderQueue(){
  const fl = STATE.fl;
  REMINDER_QUEUE = fl.members
    .filter(m => m.phone && outstandingFils(fl, m.id) > 0)
    .map(m => ({ id: m.id, name: m.name, phone: m.phone, owed: outstandingFils(fl, m.id) }));
  REMINDER_POS = 0;
  renderReminderStep();
}
function renderReminderStep(){
  const area = document.getElementById("reminderArea");
  if(REMINDER_POS >= REMINDER_QUEUE.length){
    area.innerHTML = `<div class="card reminder-card"><p>✅ All reminders sent.</p></div>`;
    return;
  }
  const m = REMINDER_QUEUE[REMINDER_POS];
  area.innerHTML = `<div class="card reminder-card">
    <h2 style="color:var(--wa-deep)">Reminder ${REMINDER_POS+1} of ${REMINDER_QUEUE.length}</h2>
    <p><strong>${escapeHtml(m.name)}</strong> owes BHD ${bhd(m.owed)}</p>
    <div class="row">
      <button class="wa" onclick="sendCurrentReminder()">📱 Open WhatsApp &amp; next</button>
      <button onclick="skipCurrentReminder()">Skip</button>
      <button class="ghost" onclick="document.getElementById('reminderArea').innerHTML=''">Cancel</button>
    </div>
  </div>`;
}
function sendCurrentReminder(){
  const m = REMINDER_QUEUE[REMINDER_POS];
  const digits = m.phone.replace(/[^\d]/g, "");
  const msg = `Hi ${m.name}, your shuttle payment of BHD ${bhd(m.owed)} for ${STATE.fl.flightName} is pending. Please settle when you can. - ${STATE.fl.adminName || "Admin"}`;
  window.open(`https://wa.me/${digits}?text=${encodeURIComponent(msg)}`, "_blank");
  REMINDER_POS++;
  renderReminderStep();
}
function skipCurrentReminder(){ REMINDER_POS++; renderReminderStep(); }

/* ===================================================================
   TAB — REPORT (P/A marks)
   =================================================================== */
let PERIOD = "month";
let ANCHOR = todayISO();
const PERIOD_LABEL = { day:"Day", week:"Week", month:"Month", all:"All time" };

function pageReport(fl){
  const sessions = sessionsInPeriod(fl, PERIOD, ANCHOR);
  const members = fl.members.filter(m => m.active || fl.sessions.some(s => s.shares[m.id]));
  const header = sessions.map(s => `<th colspan="2">${shortDate(s.date)}</th>`).join("");
  const metric = (label, fn) => `<tr class="metric"><td></td><td>${label}</td>
    ${sessions.map(s => `<td></td><td class="num">${fn(s)}</td>`).join("")}</tr>`;

  const body = members.map((m,i) => {
    const cells = sessions.map(s => s.shares[m.id]
      ? `<td class="pmark">P</td><td class="shr">${bhd(s.shares[m.id])}</td>`
      : `<td class="amark">A</td><td class="shr"></td>`).join("");
    const owed = outstandingFils(fl, m.id);
    return `<tr><td class="num">${i+1}</td><td>${escapeHtml(m.name)}</td>${cells}
      <td class="pay" style="color:${owed?"var(--coral-deep)":"var(--court-deep)"}">${bhd(owed)}</td></tr>`;
  }).join("");

  const footer = `<tr><td></td><td></td>
    ${sessions.map(s => `<td></td><td>${bhd(Object.values(s.shares).reduce((a,b)=>a+b,0))}</td>`).join("")}
    <td>${bhd(members.reduce((sum,m) => sum + outstandingFils(fl,m.id), 0))}</td></tr>`;
  const title = PERIOD === "all" ? "All recorded games" : `${PERIOD_LABEL[PERIOD]} view — ${sessions.length} game(s)`;

  return `
  <div class="card no-print"><h2 class="tab-report">Report</h2>
    <div class="row">
      <div class="field"><label>Period</label>
        <select onchange="setPeriod(this.value)">${Object.entries(PERIOD_LABEL).map(([k,v]) =>
          `<option value="${k}" ${PERIOD===k?"selected":""}>${v}</option>`).join("")}</select></div>
      <div class="field"><label>Date within period</label>
        <input type="date" value="${ANCHOR}" onchange="setAnchor(this.value)" ${PERIOD==="all"?"disabled":""}></div>
      <div class="field"><label>&nbsp;</label><button class="primary" onclick="window.print()">🖨️ Print / Save PDF</button></div>
    </div>
  </div>
  <div class="card">
    <h2 class="tab-report" style="text-align:center;font-size:19px">${escapeHtml(fl.flightName)} — Shuttle Cost Sheet</h2>
    <p class="sub" style="text-align:center">${title}${fl.adminName ? ` · Admin: ${escapeHtml(fl.adminName)}` : ""}</p>
    ${sessions.length ? `<div style="overflow-x:auto"><table class="report"><thead>
      <tr><th rowspan="2" style="width:38px">S.No</th><th rowspan="2">Name</th>${header}
        <th rowspan="8" style="width:100px;color:#3a2b00">Amount<br>to Pay</th></tr>
      <tr>${sessions.map(()=>`<th></th><th></th>`).join("")}</tr></thead>
      <tbody>
        ${metric("No. of Shuttles Used", s => s.shuttlesUsed)}
        ${metric("No. of Players Present", s => s.presentIds.length)}
        ${metric("No. of Players Absent", s => members.length - s.presentIds.length)}
        ${metric("Shuttle Cost", s => bhd(s.totalCostFils))}
        ${metric("Each Share", s => bhd(Math.round(s.totalCostFils / s.presentIds.length)))}
        ${body}
      </tbody><tfoot>${footer}</tfoot></table></div>`
      : `<p class="muted" style="text-align:center;padding:30px">No games in this period.</p>`}
  </div>`;
}
function setPeriod(v){ PERIOD = v; render(); }
function setAnchor(v){ ANCHOR = v; render(); }

/* =============================== BOOT =============================== */
async function wakeServer(){
  const msgEl = document.getElementById("splashMsg");
  const start = Date.now();
  while(true){
    try{ await fetch("/api/ping", { cache: "no-store" }); break; }
    catch{
      if(Date.now() - start > 55000){ msgEl.textContent = "Still trying — this can take a minute on first load…"; }
      await new Promise(r => setTimeout(r, 2000));
    }
  }
}

(async function boot(){
  await wakeServer();
  document.getElementById("splash").style.display = "none";

  const params = new URLSearchParams(location.search);
  const publicToken = params.get("p");
  if(publicToken){ await renderPublicView(publicToken); return; }

  if(getToken()){ try{ await refreshFlight(); }catch{} }
  render();
})();
</script>
